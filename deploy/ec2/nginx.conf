# Managed by Return Tech deployment.
# install.sh replaces __PUBLIC_HOST__ with the validated public hostname or IPv4.
server {
    listen 80;
    server_name __PUBLIC_HOST__;
    root /var/www/returntech;
    index index.html;
    autoindex off;
    client_max_body_size 5m;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api {
        default_type application/json;
        return 404 '{"error":"Recurso não encontrado."}';
    }

    location ^~ /api/ {
        # No trailing slash: preserve /api/... when forwarding to Flask.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 404 = @api_not_found;
    }

    location @api_not_found {
        default_type application/json;
        return 404 '{"error":"Recurso não encontrado."}';
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
